name: Ozone
options:
  bundleIdPrefix: com.ibrardev
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

# Shared settings untuk semua target
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    ONLY_ACTIVE_ARCH: YES
    ENABLE_HARDENED_RUNTIME: YES
    # Apple Silicon only
    ARCHS: arm64
    VALID_ARCHS: arm64

targets:

  # ─────────────────────────────────────────────
  # MARK: - Main App Target
  # ─────────────────────────────────────────────
  Ozone:
    type: application
    platform: macOS
    deploymentTarget: "13.0"

    info:
      path: BatteryGuard/Resources/Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleDisplayName: Ozone
        CFBundleIdentifier: com.ibrardev.Ozone
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: "Copyright © 2024 IbrarDev. Open Source."
        NSInputMonitoringUsageDescription: "Ozone requires Input Monitoring permission to count keyboard key presses across all applications."
        NSAccessibilityUsageDescription: "Ozone requires Accessibility permission to separate mouse and trackpad scroll directions."
        NSScreenCaptureUsageDescription: "Ozone requires Screen & System Audio Recording permission to capture and adjust per-application volume levels."
        NSAudioCaptureUsageDescription: "Ozone requires audio access to control per-application volume levels."
        NSSystemAudioCaptureUsageDescription: "Ozone requires audio access to control per-application volume levels."
        NSMicrophoneUsageDescription: "Ozone requires audio access to control per-application volume levels."
        SMPrivilegedExecutables:
          "com.ibrardev.Ozone.Helper": "identifier \"com.ibrardev.Ozone.Helper\""

    entitlements:
      path: BatteryGuard/Resources/BatteryGuard.entitlements
      properties:
        "com.apple.security.app-sandbox": false
        "com.apple.security.network.client": true
        "com.apple.security.files.user-selected.read-write": true
        "com.apple.security.get-task-allow": true

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrardev.Ozone
        PRODUCT_NAME: Ozone
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: BatteryGuard/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: BatteryGuard/Resources/BatteryGuard.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    # Semua source file main app — explicit list untuk avoid duplikasi
    sources:
      # Assets
      - path: BatteryGuard/Assets.xcassets
      # Shared protocol (di-include ke kedua target)
      - path: Shared/BatteryGuardXPCProtocol.swift
        buildPhase: sources
      # App entry
      - path: BatteryGuard/App/BatteryGuardApp.swift
      - path: BatteryGuard/App/AppDelegate.swift
      - path: BatteryGuard/App/MenuBarAppKitLabel.swift
      # Menu Bar
      - path: BatteryGuard/MenuBar/MenuBarView.swift
      - path: BatteryGuard/MenuBar/StatusBarMetricView.swift
      # Dashboard root
      - path: BatteryGuard/Dashboard/DashboardView.swift
      - path: BatteryGuard/Dashboard/LogView.swift
      - path: BatteryGuard/Dashboard/Sidebar/SidebarView.swift
      # Dashboard Cards
      - path: BatteryGuard/Dashboard/Cards/DashboardCardView.swift
      - path: BatteryGuard/Dashboard/Cards/BatterySpecsCard.swift
      - path: BatteryGuard/Dashboard/Cards/BatteryHealthCard.swift
      - path: BatteryGuard/Dashboard/Cards/PowerAdapterCard.swift
      - path: BatteryGuard/Dashboard/Cards/BatteryLevelCard.swift
      - path: BatteryGuard/Dashboard/Cards/BatteryCyclesCard.swift
      - path: BatteryGuard/Dashboard/Cards/BatteryTemperatureCard.swift
      - path: BatteryGuard/Dashboard/Cards/PowerConsumptionCard.swift
      - path: BatteryGuard/Dashboard/Cards/PowerFlowCard.swift
      - path: BatteryGuard/Dashboard/Cards/EnergyAppsCard.swift
      - path: BatteryGuard/Dashboard/Cards/CalibrationCard.swift
      - path: BatteryGuard/Dashboard/Cards/NetworkSpeedCard.swift
      - path: BatteryGuard/Dashboard/Cards/VolumeMixerView.swift
      - path: BatteryGuard/Dashboard/Cards/MouseControlView.swift
      - path: BatteryGuard/Dashboard/Cards/KeyboardMonitorView.swift
      # Settings
      - path: BatteryGuard/Settings/SettingsView.swift
      # Uninstaller
      - path: BatteryGuard/Uninstaller/UninstallerView.swift
      # Models
      - path: BatteryGuard/Models/BatteryInfo.swift
      - path: BatteryGuard/Models/NetworkStats.swift
      - path: BatteryGuard/Models/RAMStats.swift
      - path: BatteryGuard/Models/CPUStats.swift
      - path: BatteryGuard/Models/GPUStats.swift
      - path: BatteryGuard/Models/TemperatureReading.swift
      - path: BatteryGuard/Models/UninstallerModels.swift
      - path: BatteryGuard/Models/VolumeApp.swift
      - path: BatteryGuard/Models/KeyboardModels.swift
      # Services
      - path: BatteryGuard/Services/BatteryMonitor.swift
      - path: BatteryGuard/Services/RAMMonitor.swift
      - path: BatteryGuard/Services/NetworkSpeedMonitor.swift
      - path: BatteryGuard/Services/TemperatureMonitor.swift
      - path: BatteryGuard/Services/SMCTemperatureProvider.swift
      - path: BatteryGuard/Services/CPUMonitor.swift
      - path: BatteryGuard/Services/GPUMonitor.swift
      - path: BatteryGuard/Services/ChargeLimitManager.swift
      - path: BatteryGuard/Services/CycleHistoryStore.swift
      - path: BatteryGuard/Services/LevelHistoryStore.swift
      - path: BatteryGuard/Services/PreferencesStore.swift
      - path: BatteryGuard/Services/MouseScrollService.swift
      - path: BatteryGuard/Services/UninstallerService.swift
      - path: BatteryGuard/Services/VolumeMixerService.swift
      - path: BatteryGuard/Services/BoostLimiter.swift
      - path: BatteryGuard/Services/ResponsibleProcess.swift
      - path: BatteryGuard/Services/MixerRender.swift
      - path: BatteryGuard/Services/MixerRoutingSupport.swift
      - path: BatteryGuard/Services/TapGainEngine.swift
      - path: BatteryGuard/Services/KeyboardMonitorService.swift
      - path: BatteryGuard/Services/KeyboardStatsStore.swift
      # XPC client
      - path: BatteryGuard/XPC/HelperConnection.swift
      # ViewModel
      - path: BatteryGuard/ViewModels/SystemStatsViewModel.swift
      - path: BatteryGuard/ViewModels/UninstallerViewModel.swift

    # Helper dependencies & copying
    dependencies:
      - target: OzoneHelper
      # SDK dependencies
      - sdk: ServiceManagement.framework
      - sdk: IOKit.framework

    postBuildScripts:
      - name: Copy Helper & Plist to Bundle
        script: |
          mkdir -p "${CONFIGURATION_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          cp "${SRCROOT}/BatteryGuard/Resources/com.ibrardev.Ozone.Helper.plist" "${CONFIGURATION_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons/"
          cp "${CONFIGURATION_BUILD_DIR}/com.ibrardev.Ozone.Helper" "${CONFIGURATION_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/MacOS/"

  # ─────────────────────────────────────────────
  # MARK: - Privileged Helper Target
  # ─────────────────────────────────────────────
  OzoneHelper:
    type: tool
    platform: macOS
    deploymentTarget: "13.0"

    info:
      path: BatteryGuardHelper/Info.plist
      properties:
        CFBundleIdentifier: com.ibrardev.Ozone.Helper
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        SMAuthorizedClients:
          - "identifier \"com.ibrardev.Ozone\""
        MachServices:
          "com.ibrardev.Ozone.Helper": true

    entitlements:
      path: BatteryGuardHelper/BatteryGuardHelper.entitlements
      properties:
        "com.apple.security.app-sandbox": false

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ibrardev.Ozone.Helper
        PRODUCT_NAME: com.ibrardev.Ozone.Helper
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: BatteryGuardHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        OTHER_LDFLAGS: ["-sectcreate", "__TEXT", "__info_plist", "$(SRCROOT)/BatteryGuardHelper/Info.plist"]
        CODE_SIGN_ENTITLEMENTS: BatteryGuardHelper/BatteryGuardHelper.entitlements
        CODE_SIGN_STYLE: Automatic
        # Helper harus di-install ke /Library/PrivilegedHelperTools
        INSTALL_PATH: /Library/PrivilegedHelperTools
        SKIP_INSTALL: YES

    sources:
      # Shared protocol
      - path: Shared/BatteryGuardXPCProtocol.swift
        buildPhase: sources
      # Helper implementation
      - path: BatteryGuardHelper/main.swift
      - path: BatteryGuardHelper/SMCController.swift
      - path: BatteryGuardHelper/HelperTool.swift

    dependencies:
      - sdk: IOKit.framework

schemes:
  Ozone:
    build:
      targets:
        Ozone: all
        OzoneHelper: all
    run:
      config: Debug
      executable: Ozone
    archive:
      config: Release
